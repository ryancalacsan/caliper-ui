version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR a month for routine minor/patch bumps; majors still come one at a time.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Playwright must move in lockstep with the CI container image
      # (mcr.microsoft.com/playwright:vX-noble) and the committed visual
      # baselines, so it is bumped by hand.
      - dependency-name: playwright
      - dependency-name: '@playwright/test'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
