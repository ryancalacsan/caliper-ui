version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Packages that share a version and peer-depend on each other must move
      # together, majors included, or npm ci fails with ERESOLVE. Dependabot
      # assigns each update to the first matching group, so these come first.
      vitest:
        patterns: ['vitest', '@vitest/*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      # One PR a month for routine minor/patch bumps; majors still come one at a time.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Every ignore here is reported monthly by .github/workflows/held-upgrades.yml
    # (scripts/check-held-upgrades.mjs), which keeps a "Held-back upgrades" issue
    # open while a newer version is waiting. The comment above each entry is the
    # reason shown in that issue, so keep it current.
    ignore:
      # Playwright must move in lockstep with the CI container image
      # (mcr.microsoft.com/playwright:vX-noble) and the committed visual
      # baselines, so it is bumped by hand.
      - dependency-name: playwright
      - dependency-name: '@playwright/test'
      # Node type majors are bumped by hand along with the Node version CI runs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 drops the JS compiler API that vite-plugin-dts uses to emit
      # the library's .d.ts files. Remove once the plugin supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Dependabot's vitest group bumps vitest without its @vitest/* plugins,
      # which fails npm ci (#46, #49). Vitest majors are upgraded by hand.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
